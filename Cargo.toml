[package]
name = "dstd"
version = "0.1.0"
edition = "2024"

authors = ["Neltharion01 <NtNeltharion@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Lightweight std replacement"
readme = "README.md"
repository = "https://github.com/DragonCrates/dstd"
keywords = ["no_std"]

[features]
# no-crt: enables building without ucrt
# More info: examples/no-crt
# Currently, it only changes `main` name to `mainCRTStartup`
# Unless you know what is this, you would probably never use this
no-crt = []
